name: CantaLocal - Android ARM64 autonomous
on:
  push:
    branches:
      - build-cantalocal-android-arm64
    paths:
      - "CantaLocal/**"
      - ".github/workflows/build-cantalocal.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Obtain previously verified ACE-Step native engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cantalocal-engine-artifact
          gh run download 43897619529 --repo "$GITHUB_REPOSITORY" --name CantaLocal-0.4.0-arm64 --dir /tmp/cantalocal-engine-artifact
          ENGINE_APK="$(find /tmp/cantalocal-engine-artifact -name '*.apk' -print -quit)"
          test -s "$ENGINE_APK"
          printf '%s  %s\n' "2fd1d95965bd6a06d9302a7f64744a87446119da084fed0dcddf70c0ca44840c" "$ENGINE_APK" | sha256sum -c -
          mkdir -p CantaLocal/app/src/main/jniLibs/arm64-v8a
          unzip -jo "$ENGINE_APK" 'lib/arm64-v8a/*.so' -d CantaLocal/app/src/main/jniLibs/arm64-v8a
          test -s CantaLocal/app/src/main/jniLibs/arm64-v8a/libace-server.so
          test -s CantaLocal/app/src/main/jniLibs/arm64-v8a/libggml-base.so
          test -s CantaLocal/app/src/main/jniLibs/arm64-v8a/libggml-cpu.so
          test -s CantaLocal/app/src/main/jniLibs/arm64-v8a/libggml.so
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build corrected Android APK
        working-directory: CantaLocal
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK and embedded motor
        id: verify
        working-directory: CantaLocal
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -s "$APK"
          unzip -t "$APK" | tail -1
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libace-server.so"
          sha256sum "$APK"
          cp "$APK" "$RUNNER_TEMP/CantaLocal-0.5.0-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: CantaLocal-0.5.0-arm64
          path: CantaLocal/app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: Publish public direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/CantaLocal-0.5.0-arm64.apk" "./CantaLocal-0.5.0-arm64.apk"
          SHA="$(sha256sum CantaLocal-0.5.0-arm64.apk | awk '{print $1}')"
          if gh release view cantalocal-v0.5.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload cantalocal-v0.5.0 CantaLocal-0.5.0-arm64.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create cantalocal-v0.5.0 CantaLocal-0.5.0-arm64.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target build-cantalocal-android-arm64 \
              --title "CantaLocal 0.5.0 - descargas persistentes e icono" \
              --notes "Mejoras: Android DownloadManager maneja en segundo plano cuatro descargas con progreso persistente ante cierre de pantalla, cambio de red y reinicios. Los modelos terminados se verifican SHA-256 antes de usarse. Icono musical nuevo. Identificador canonico cl.cantalocal.autonomo: por claves de prueba incompatibles hay que desinstalar versiones anteriores antes de instalar esta (los modelos parciales de esas versiones no pueden migrarse). Motor ARM64 incorporado. No requiere Termux. Aun no verificada la generacion en HONOR Magic7 Lite. SHA-256: $SHA" \
              --prerelease
          fi
