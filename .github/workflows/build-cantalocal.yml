name: CantaLocal - release firmado con clave estable

on:
  workflow_dispatch:
  push:
    branches: [cantalocal-stable-signing]
    paths:
      - "CantaLocal/**"
      - ".github/workflows/build-cantalocal.yml"

permissions:
  contents: write
  actions: read

jobs:
  build-signed-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore ACE-Step ARM64 engine from previously verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/cantalocal-engine-artifact
          gh run download 43897619529 --repo "$GITHUB_REPOSITORY" --name CantaLocal-0.4.0-arm64 --dir /tmp/cantalocal-engine-artifact
          ENGINE_APK="$(find /tmp/cantalocal-engine-artifact -name '*.apk' -print -quit)"
          test -s "$ENGINE_APK"
          printf '%s  %s\n' "2fd1d95965bd6a06d9302a7f64744a87446119da084fed0dcddf70c0ca44840c" "$ENGINE_APK" | sha256sum -c -
          mkdir -p CantaLocal/app/src/main/jniLibs/arm64-v8a
          unzip -jo "$ENGINE_APK" 'lib/arm64-v8a/*.so' -d CantaLocal/app/src/main/jniLibs/arm64-v8a
          test -s CantaLocal/app/src/main/jniLibs/arm64-v8a/libace-server.so

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore confidential permanent app-signing key
        env:
          STORE_B64: ${{ secrets.CANTALOCAL_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CANTALOCAL_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CANTALOCAL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CANTALOCAL_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          if [ -z "$STORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::No se configuró la firma estable. Se rechaza publicar una nueva APK firmada al azar."
            exit 1
          fi
          printf '%s' "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/cantalocal-release.jks"
          chmod 600 "$RUNNER_TEMP/cantalocal-release.jks"
          echo "CANTALOCAL_KEYSTORE_PATH=$RUNNER_TEMP/cantalocal-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK with stable signing certificate
        env:
          CANTALOCAL_STORE_PASSWORD: ${{ secrets.CANTALOCAL_STORE_PASSWORD }}
          CANTALOCAL_KEY_ALIAS: ${{ secrets.CANTALOCAL_KEY_ALIAS }}
          CANTALOCAL_KEY_PASSWORD: ${{ secrets.CANTALOCAL_KEY_PASSWORD }}
        working-directory: CantaLocal
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Validate Android signature, version and model engine
        env:
          EXPECTED_CERT: ${{ secrets.CANTALOCAL_SIGNER_SHA256 }}
        working-directory: CantaLocal
        run: |
          set -Eeuo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -s "$APK"
          test -n "$EXPECTED_CERT" || { echo "::error::Debe fijarse la huella pública del certificado para impedir cambios de firma."; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d '\r' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT" | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::La firma no coincide con la clave autorizada. Se cancela la publicación."
            exit 1
          fi
          unzip -t "$APK" | tail -1
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libace-server.so"
          sha256sum "$APK"
          cp "$APK" "$RUNNER_TEMP/CantaLocal-0.8.0-stable.apk"

      - name: Publish only verified release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cp "$RUNNER_TEMP/CantaLocal-0.8.0-stable.apk" ./CantaLocal-0.8.0-stable.apk
          if gh release view cantalocal-v0.8.0-stable --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Ya existe esta versión. No se sobrescribirá una APK publicada."
            exit 1
          fi
          gh release create cantalocal-v0.8.0-stable CantaLocal-0.8.0-stable.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target cantalocal-stable-signing \
            --title "CantaLocal 0.8.0 (firma persistente)" \
            --notes "Primera versión con clave estable privada y verificación SHA-256 de certificado. Solo se publica cuando la firma está configurada y comprobada. Advertencia: si una instalación anterior utiliza otra clave, Android no la puede actualizar en el mismo paquete."
