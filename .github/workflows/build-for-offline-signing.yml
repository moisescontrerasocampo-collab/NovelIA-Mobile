name: CantaLocal - build para firma privada local
on:
  workflow_dispatch:
  push:
    branches: [cantalocal-stable-signing]
    paths:
      - ".github/workflows/build-for-offline-signing.yml"
      - "CantaLocal/**"
permissions:
  contents: read
  actions: read
jobs:
  unsigned-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Extraer ACE-Step del artefacto verificado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/engine
          gh run download 43897619529 --repo "$GITHUB_REPOSITORY" --name CantaLocal-0.4.0-arm64 --dir /tmp/engine
          ENGINE="$(find /tmp/engine -name '*.apk' -print -quit)"
          printf '%s  %s\n' '2fd1d95965bd6a06d9302a7f64744a87446119da084fed0dcddf70c0ca44840c' "$ENGINE" | sha256sum -c -
          mkdir -p CantaLocal/app/src/main/jniLibs/arm64-v8a
          unzip -jo "$ENGINE" 'lib/arm64-v8a/*.so' -d CantaLocal/app/src/main/jniLibs/arm64-v8a
      - name: Build APK, luego se firma localmente con firma privada
        working-directory: CantaLocal
        run: gradle --no-daemon :app:assembleDebug
      - name: Guardar herramientas de firma y APK temporal
        run: |
          set -euo pipefail
          mkdir -p export
          cp CantaLocal/app/build/outputs/apk/debug/app-debug.apk export/CantaLocal-v0.8.0-temp.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          cp "$(dirname "$APKSIGNER")/lib/apksigner.jar" export/apksigner.jar
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$ZIPALIGN"
          cp "$ZIPALIGN" export/zipalign
          sha256sum export/*
      - uses: actions/upload-artifact@v4
        with:
          name: CantaLocal-v0.8.0-offline-signing-tools
          path: export/*
          retention-days: 30
