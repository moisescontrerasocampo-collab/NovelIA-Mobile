name: Publish CantaLocal Android APK
on:
  push:
    branches: [build-cantalocal-android-arm64]
    paths:
      - ".github/workflows/release-cantalocal.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download CantaLocal 0.4 Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 43897619529 --repo "$GITHUB_REPOSITORY" --name CantaLocal-0.4.0-arm64 --dir dist
          echo "Artifact contents:"
          find dist -type f -maxdepth 2 -ls
          APK=$(find dist -maxdepth 2 -name '*.apk' -type f -print -quit)
          test -n "$APK"
          mv "$APK" /tmp/CantaLocal-0.4.0-arm64.apk
          rm -rf dist
          mkdir dist
          mv /tmp/CantaLocal-0.4.0-arm64.apk dist/
          printf '%s  %s\n' '2fd1d95965bd6a06d9302a7f64744a87446119da084fed0dcddf70c0ca44840c' 'dist/CantaLocal-0.4.0-arm64.apk' | sha256sum -c -
          unzip -t dist/CantaLocal-0.4.0-arm64.apk | tail -1
      - name: Publish direct public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view cantalocal-v0.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload cantalocal-v0.4.0 dist/CantaLocal-0.4.0-arm64.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create cantalocal-v0.4.0 dist/CantaLocal-0.4.0-arm64.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target build-cantalocal-android-arm64 \
              --title "CantaLocal 0.4.0 - Android ARM64 (experimental)" \
              --notes "APK experimental con motor ACE-Step ARM64 incorporado. Descarga automática de modelos. Aún no validada la generación de canciones en HONOR Magic7 Lite. No requiere Termux. SHA-256: 2fd1d95965bd6a06d9302a7f64744a87446119da084fed0dcddf70c0ca44840c"
          fi
